[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mosaic"
version = "0.1.0"
description = "MOSAIC - Multi-Source Analytics, Signal & Intelligence Core: a research-grade multi-source Data Science platform for temporal, relational and behavioral anomaly analysis"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "TMStroo" }]
keywords = ["data-science", "entity-resolution", "anomaly-detection", "temporal", "graph", "reproducible-research"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "polars>=1.20",
  "pyarrow>=17",
  "duckdb>=1.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "networkx>=3.2",
  "lightgbm>=4.3",
  "xgboost>=2.1",
  "joblib>=1.4",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
mosaic = "mosaic.cli.main:run"

[project.urls]
Homepage = "https://github.com/TMStroo/MOSAIC"
Repository = "https://github.com/TMStroo/MOSAIC"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: long running tests",
  "e2e: end-to-end pipeline tests",
  "leakage: leakage prevention tests",
  "perf: performance / scaling tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "W", "C4", "SIM", "RUF", "TID", "PTH", "ARG", "PL"]
ignore = ["PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLR0911", "PLR0915", "E501", "B008", "N818", "ARG002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "PLR2004", "S101", "PLC0415", "RUF059"]
"__init__.py" = ["F401"]
# PLC0415 (import-outside-top-level) is disabled per file, and only per file, for
# two distinct reasons. Neither is a blanket exemption: a lazy import in any other
# module is still reported, so a new one has to be justified the same way.
#
# 1. Optional or platform-conditional dependencies, imported inside the function
#    that needs them so the module imports and runs without the extra installed.
#    `psutil` is a soft dependency (provenance/timing fall back to returning None),
#    `resource` is POSIX-only, `yaml`/`pyarrow`/`sklearn` are heavy enough that
#    importing them at module scope would slow every CLI start.
"src/mosaic/utils/provenance.py" = ["PLC0415"]
"src/mosaic/utils/timing.py" = ["PLC0415"]
# SIM108: the if/else states the yaml-vs-json dispatch explicitly.
"src/mosaic/utils/io.py" = ["PLC0415", "SIM108"]
# Three further findings are deliberate style, each confined to one file:
#   N806  figures.py: `H` is a local box-height constant named to match the w/h
#         geometry vocabulary used throughout that module.
#   SIM103 protocol.py: Period.contains is two sequential guard clauses; the
#         negated compound form ruff suggests is shorter but harder to check by
#         eye, and this file decides which rows a period may see.
#   PLW0603 logging.py: the module-level `_CONFIGURED` guard is the standard
#         idempotent-init pattern and is correct as written.
"src/mosaic/reporting/figures.py" = ["N806", "PLR0917", "ARG001"]
"src/mosaic/experiments/protocol.py" = ["SIM103"]
"src/mosaic/settings/logging.py" = ["PLW0603"]
"src/mosaic/entity_resolution/matchers.py" = ["PLC0415"]
# 2. Genuine import-cycle breaks. These import a module that imports this one
#    back, so a top-level import would be a cycle. Moving them to the top would
#    break the package, not clean it.
#      cleaning.events      -> ingestion.synthetic.vocabulary (vocabulary -> schema.canonical)
#      features.compute     -> graph.features   (graph -> temporal -> features.compute for the fit path)
#      graph.peers          -> graph.temporal    (temporal must not depend on peers)
#      entity_resolution.base -> schema.ids
#      ingestion.registry   -> ingestion.base / synthetic.adapters (adapters -> registry)
"src/mosaic/cleaning/events.py" = ["PLC0415", "ARG001"]
"src/mosaic/features/compute.py" = ["PLC0415", "ARG001", "PLR0917"]
"src/mosaic/graph/peers.py" = ["PLC0415"]
# ARG001 / PLR0917 elsewhere: uniform-signature dispatch, not dead parameters.
#   graph/temporal.py: the graph-feature builder and its snapshots share one
#     signature so the feature loop can call them from a table.
#   cleaning/events.py, validation/quality.py, ingestion/synthetic/generator.py:
#     step functions with a common interface, invoked uniformly from a pipeline
#     table; an argument unused by one step is an interface, not an oversight.
#   features/compute.py (above): the seven `_`-prefixed family builders
#     (_frequency/_statistical/_temporal/_behavioral/_data_quality/_sequence/
#     _cross_source) share one signature so `compute_features` can dispatch over
#     them from a table. A family that fits nothing must still accept `state`.
"src/mosaic/graph/temporal.py" = ["ARG001", "PLR0917"]
"src/mosaic/validation/quality.py" = ["ARG001"]
"src/mosaic/ingestion/synthetic/generator.py" = ["ARG001"]
"src/mosaic/entity_resolution/base.py" = ["PLC0415"]
"src/mosaic/ingestion/registry.py" = ["PLC0415"]
"src/mosaic/ingestion/synthetic/adapters.py" = ["PLC0415"]
"src/mosaic/ingestion/synthetic/builder.py" = ["PLC0415"]
"src/mosaic/ingestion/synthetic/vocabulary.py" = ["PLC0415"]
"src/mosaic/ingestion/synthetic/__init__.py" = ["PLC0415"]
# 3. One more deliberate convention, confined to a single file:
#      detection/ml.py: `X` is the design-matrix argument name throughout
#        scikit-learn's own API, its type stubs and its documentation. Matching
#        it exactly keeps every estimator in this module recognisable to anyone
#        who knows sklearn, and renaming it to `features` would make the
#        correspondence harder, not easier. N806 (variable) and N803 (argument)
#        are the two rules it triggers.
"src/mosaic/detection/ml.py" = ["N806", "N803"]

[tool.ruff.lint.isort]
known-first-party = ["mosaic"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
namespace_packages = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["polars.*", "duckdb.*", "lightgbm.*", "xgboost.*", "networkx.*", "statsmodels.*"]
ignore_missing_imports = true
