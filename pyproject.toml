[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mosaic"
version = "0.1.0"
description = "MOSAIC - Multi-Source Analytics, Signal & Intelligence Core: a research-grade multi-source Data Science platform for temporal, relational and behavioral anomaly analysis"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "TMStroo" }]
keywords = ["data-science", "entity-resolution", "anomaly-detection", "temporal", "graph", "reproducible-research"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "polars>=1.20",
  "pyarrow>=17",
  "duckdb>=1.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "networkx>=3.2",
  "lightgbm>=4.3",
  "xgboost>=2.1",
  "joblib>=1.4",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
mosaic = "mosaic.cli.main:run"

[project.urls]
Homepage = "https://github.com/TMStroo/MOSAIC"
Repository = "https://github.com/TMStroo/MOSAIC"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: long running tests",
  "e2e: end-to-end pipeline tests",
  "leakage: leakage prevention tests",
  "perf: performance / scaling tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "W", "C4", "SIM", "RUF", "TID", "PTH", "ARG", "PL"]
ignore = ["PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLR0911", "PLR0915", "E501", "B008", "N818", "ARG002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "PLR2004", "S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["mosaic"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
namespace_packages = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["polars.*", "duckdb.*", "lightgbm.*", "xgboost.*", "networkx.*", "statsmodels.*"]
ignore_missing_imports = true
